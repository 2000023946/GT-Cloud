
name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: control-plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Generate coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')

          echo "Control Plane coverage: ${COVERAGE}%"

          if awk "BEGIN {exit !($COVERAGE < 95)}"; then
            echo "ERROR: Control Plane coverage is below 95%"
            exit 1
          fi

  data-plane:
    name: Data Plane
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t gt-cloud-data-plane-test .

      - name: Run tests and coverage
        run: docker run --rm gt-cloud-data-plane-test

